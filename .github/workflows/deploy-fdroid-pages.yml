name: Deploy F-Droid Repo and GitHub Pages

on:
  repository_dispatch:
    types: [new_release]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_deploy:
    name: Build F-Droid Index & Deploy Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python & JDK
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install fdroidserver & Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fdroidserver aapt apksigner || pip install fdroidserver

      - name: Handle Repository Dispatch & Verify APK
        if: github.event_name == 'repository_dispatch'
        shell: bash
        run: |
          echo "=== Processing repository_dispatch payload ==="
          
          SOURCE_REPO="${{ github.event.client_payload.source_repo }}"
          PACKAGE_NAME="${{ github.event.client_payload.package_name }}"
          VERSION_NAME="${{ github.event.client_payload.version }}"
          VERSION_CODE="${{ github.event.client_payload.version_code }}"
          TAG_NAME="${{ github.event.client_payload.tag }}"
          ASSET_NAME="${{ github.event.client_payload.asset_name }}"

          # Fallbacks if alternate payload keys are used
          if [ -z "$PACKAGE_NAME" ]; then PACKAGE_NAME="${{ github.event.client_payload.app }}"; fi
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="${{ github.event.client_payload.version_name }}"; fi
          if [ -z "$TAG_NAME" ]; then TAG_NAME="${{ github.event.client_payload.tag_name }}"; fi
          if [ -z "$ASSET_NAME" ]; then ASSET_NAME="${{ github.event.client_payload.apk_name }}"; fi

          echo "Payload details:"
          echo "  Source Repo:  $SOURCE_REPO"
          echo "  Package Name: $PACKAGE_NAME"
          echo "  Version Name: $VERSION_NAME"
          echo "  Version Code: $VERSION_CODE"
          echo "  Tag Name:     $TAG_NAME"
          echo "  Asset Name:   $ASSET_NAME"

          # 1. Validate required payload fields
          if [ -z "$SOURCE_REPO" ] || [ -z "$PACKAGE_NAME" ] || [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ] || [ -z "$TAG_NAME" ] || [ -z "$ASSET_NAME" ]; then
            echo "Error: Missing required fields in repository_dispatch payload!"
            exit 1
          fi

          # 2. Validate source repository whitelist
          ALLOWED_REPOS="saurabhkundu1/skycast-weather saurabhkundu1/secure-password-manager"
          if [[ ! " $ALLOWED_REPOS " =~ " $SOURCE_REPO " ]]; then
            echo "Error: Unauthorized or unsupported source repository: $SOURCE_REPO"
            exit 1
          fi

          # 3. Validate package ID whitelist
          ALLOWED_PACKAGES="com.applify.skycast com.applify.securepass"
          if [[ ! " $ALLOWED_PACKAGES " =~ " $PACKAGE_NAME " ]]; then
            echo "Error: Invalid or unexpected package ID: $PACKAGE_NAME"
            exit 1
          fi

          # 4. Construct download URL and fetch release APK
          DOWNLOAD_URL="https://github.com/${SOURCE_REPO}/releases/download/${TAG_NAME}/${ASSET_NAME}"
          echo "Downloading APK from: $DOWNLOAD_URL"
          
          mkdir -p tmp
          TMP_APK="tmp/downloaded_${PACKAGE_NAME}.apk"
          
          curl -L -f -o "$TMP_APK" "$DOWNLOAD_URL" || {
            echo "Error: Failed to download asset from $DOWNLOAD_URL"
            exit 1
          }

          if [ ! -s "$TMP_APK" ]; then
            echo "Error: Downloaded APK file is empty!"
            exit 1
          fi

          # 5. Verify APK structure and signature
          if ! zip -T "$TMP_APK" >/dev/null 2>&1; then
            echo "Error: Downloaded file is not a valid zip/APK archive!"
            exit 1
          fi

          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify "$TMP_APK" || {
              echo "Error: APK signature verification failed!"
              exit 1
            }
          fi

          # 6. Verify actual Application ID, version name and version code
          if command -v aapt >/dev/null 2>&1; then
            BADGING=$(aapt dump badging "$TMP_APK")
            ACTUAL_PKG=$(echo "$BADGING" | grep "package: name=" | cut -d"'" -f2)
            ACTUAL_VER_CODE=$(echo "$BADGING" | grep "package: name=" | cut -d"'" -f4)
            ACTUAL_VER_NAME=$(echo "$BADGING" | grep "package: name=" | cut -d"'" -f6)

            echo "Extracted APK Badging:"
            echo "  Package ID:   $ACTUAL_PKG"
            echo "  Version Code: $ACTUAL_VER_CODE"
            echo "  Version Name: $ACTUAL_VER_NAME"

            if [ "$ACTUAL_PKG" != "$PACKAGE_NAME" ]; then
              echo "Error: APK package ID ($ACTUAL_PKG) does not match expected payload ($PACKAGE_NAME)!"
              exit 1
            fi

            if [ "$ACTUAL_VER_CODE" != "$VERSION_CODE" ]; then
              echo "Error: APK version code ($ACTUAL_VER_CODE) does not match payload ($VERSION_CODE)!"
              exit 1
            fi

            if [ "$ACTUAL_VER_NAME" != "$VERSION_NAME" ]; then
              echo "Error: APK version name ($ACTUAL_VER_NAME) does not match payload ($VERSION_NAME)!"
              exit 1
            fi
          fi

          # 7. Copy verified APK to repo directory
          mkdir -p repo
          TARGET_APK="repo/${PACKAGE_NAME}_${VERSION_CODE}.apk"
          cp "$TMP_APK" "$TARGET_APK"
          echo "Successfully verified and imported $TARGET_APK"

      - name: Ensure Metadata Exists
        shell: bash
        run: |
          mkdir -p metadata
          if [ ! -f "metadata/com.applify.skycast.yml" ]; then
            cat << 'EOF' > metadata/com.applify.skycast.yml
          Categories:
            - Weather
          License: GPL-3.0
          WebSite: "https://github.com/saurabhkundu1/skycast-weather"
          SourceCode: "https://github.com/saurabhkundu1/skycast-weather"
          IssueTracker: "https://github.com/saurabhkundu1/skycast-weather/issues"
          Name: "Skycast"
          Summary: "Modern weather app with graphs and thoughtful data visualization"
          Description: |-
            Skycast transforms and visualizes weather data from Open-Meteo.com to give you essential weather information at a glance, while allowing you to dive deeper with graphs.
          AutoName: "Skycast"
          CurrentVersion: "1.0.0"
          CurrentVersionCode: 1
          EOF
          fi

      - name: Update & Verify F-Droid Repository Index
        shell: bash
        env:
          REPO_KEYSTORE_BASE64: ${{ secrets.REPO_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          set -euo pipefail

          echo "=== 1. Validating Repository Signing Secrets ==="
          if [ -z "$REPO_KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_PASS" ]; then
            echo "Error: REPO_KEYSTORE_BASE64, KEYSTORE_PASS, and KEY_PASS secrets are required for secure publishing!"
            exit 1
          fi

          echo "Decoding keystore..."
          echo "$REPO_KEYSTORE_BASE64" | base64 -d > keystore.jks
          if [ ! -s keystore.jks ]; then
            echo "Error: Base64 keystore decoding failed or produced empty file!"
            exit 1
          fi

          EXPECTED_FINGERPRINT="DE62E0D386DB9B6FC616ADF6573F458AAC8D04F873007C73B8585FBEF0960255"
          ACTUAL_FP=$(keytool -list -v -keystore keystore.jks -storepass "$KEYSTORE_PASS" -alias "securepass" 2>/dev/null | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n 1 | tr -d ':' | tr 'a-z' 'A-Z')
          if [ -z "$ACTUAL_FP" ]; then
            echo "Error: Could not extract SHA-256 fingerprint for alias 'securepass' from keystore!"
            rm -f keystore.jks
            exit 1
          fi
          if [ "$ACTUAL_FP" != "$EXPECTED_FINGERPRINT" ]; then
            echo "Error: Keystore SHA-256 fingerprint ($ACTUAL_FP) does not match expected repository key ($EXPECTED_FINGERPRINT)!"
            rm -f keystore.jks
            exit 1
          fi

          echo "=== 2. Generating Index via F-Droid Server Toolchain ==="
          cat << EOF > config.yml
          repo_name: "Applify"
          repo_icon: "icon.png"
          repo_description: "Applify Official F-Droid Repository"
          repo_url: "https://saurabhkundu1.github.io/Applify/repo"
          keystore: "keystore.jks"
          repo_keyalias: "securepass"
          keystorepass: "$KEYSTORE_PASS"
          keypass: "$KEY_PASS"
          EOF

          fdroid update --create-metadata
          rm -f keystore.jks config.yml

          echo "=== 3. Synchronizing Root & Repo Artifacts ==="
          if [ ! -f "repo/index-v1.json" ] || [ ! -f "repo/index-v1.jar" ]; then
            echo "Error: F-Droid update failed to generate required index artifacts!"
            exit 1
          fi

          cp -f repo/index-v1.json index-v1.json
          if [ -f "repo/index-v2.json" ]; then cp -f repo/index-v2.json index-v2.json; fi
          if [ -f "repo/entry.json" ]; then cp -f repo/entry.json entry.json; fi
          if [ -f "repo/index.xml" ]; then cp -f repo/index.xml index.xml; fi
          cp -f repo/index-v1.jar index-v1.jar
          if [ -f "repo/index.jar" ]; then cp -f repo/index.jar index.jar; fi
          if [ -f "repo/entry.jar" ]; then cp -f repo/entry.jar entry.jar; fi

          echo "=== 4. Rigorous Signature, Fingerprint & Consistency Audit ==="
          verify_jar() {
            local jar_path="$1"
            local json_inside="$2"
            local json_disk="$3"

            echo "Auditing $jar_path..."
            if [ ! -f "$jar_path" ]; then
              echo "Error: Required artifact $jar_path is missing!"
              exit 1
            fi

            if ! jar tf "$jar_path" | grep -qE "^META-INF/.*\.SF$"; then
              echo "Error: $jar_path is missing signature files (unsigned JAR)!"
              exit 1
            fi

            VERIFY_OUT=$(jarsigner -verify "$jar_path" 2>&1)
            if ! echo "$VERIFY_OUT" | grep -q "jar verified."; then
              echo "Error: Jarsigner verification failed for $jar_path!"
              echo "$VERIFY_OUT"
              exit 1
            fi

            CERT_FP=$(keytool -printcert -jarfile "$jar_path" 2>/dev/null | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n 1 | tr -d ':' | tr 'a-z' 'A-Z')
            if [ -z "$CERT_FP" ]; then
              echo "Error: Could not extract SHA-256 certificate fingerprint from $jar_path!"
              exit 1
            fi
            if [ "$CERT_FP" != "$EXPECTED_FINGERPRINT" ]; then
              echo "Error: Certificate fingerprint ($CERT_FP) for $jar_path does not match repository key ($EXPECTED_FINGERPRINT)!"
              exit 1
            fi

            mkdir -p tmp_check
            unzip -q -o "$jar_path" "$json_inside" -d tmp_check
            HASH_JAR=$(sha256sum "tmp_check/$json_inside" | awk '{print $1}')
            HASH_DISK=$(sha256sum "$json_disk" | awk '{print $1}')
            rm -rf tmp_check

            if [ "$HASH_JAR" != "$HASH_DISK" ]; then
              echo "Error: Embedded $json_inside hash ($HASH_JAR) in $jar_path does not match disk hash ($HASH_DISK)!"
              exit 1
            fi

            echo "Verified $jar_path passed signature, fingerprint, and JSON consistency checks."
          }

          verify_jar "repo/index-v1.jar" "index-v1.json" "repo/index-v1.json"
          if [ -f "repo/index.jar" ]; then verify_jar "repo/index.jar" "index.xml" "repo/index.xml"; fi
          if [ -f "repo/entry.jar" ]; then verify_jar "repo/entry.jar" "entry.json" "repo/entry.json"; fi

      - name: Commit Updated Repo Artifacts to Git
        if: github.event_name == 'repository_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d "metadata" ]; then git add metadata/; fi
          if [ -d "repo" ]; then git add repo/; fi
          if [ -d "status" ]; then git add status/; fi
          if [ -d "icons" ]; then git add icons/; fi
          ls index* >/dev/null 2>&1 && git add index*
          ls entry* >/dev/null 2>&1 && git add entry*

          if ! git diff --staged --quiet; then
            git commit -m "auto: import and publish release for ${{ github.event.client_payload.package_name || 'app' }}"
            git push origin main
          else
            echo "No changes to commit"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
